[project]
name = "chatbot-pulsevent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nassanalytics", email = "nassim.naoui@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "faiss-cpu>=1.13.0",
    "langchain>=0.3.30",
    "mistral>=20.2.0",
    "mistralai>=1.10.0",
    "pandas>=2.3.3",
    "pathlib>=1.0.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.70.1",
]

[project.scripts]
chatbot-pulsevent = "chatbot_pulsevent:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
